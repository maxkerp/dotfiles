default-scheme = "base16-catppuccin-mocha"
default-cycle-ring = "catppuccin-plus"

hooks = ["tmux source-file ~/.config/tmux/tmux.conf"]

[[rings]]
name = "catppuccin-plus"
schemes = [
  "base16-catppuccin-latte",
  "base16-catppuccin-frappe",
  "base16-catppuccin-macchiato",
  "base16-catppuccin-mocha",
  "base16-default-dark",
  "base16-tokyo-night-moon",
]

[[items]]
path = "https://github.com/tinted-theming/tinted-shell"
name = "tinted-shell"
themes-dir = "scripts"
hook = ". %f"

# Alacritty terminal colors
[[items]]
name = "tinted-terminal"
path = "https://github.com/tinted-theming/tinted-terminal"
themes-dir = "themes/alacritty"
hook = "cp -f %f ~/.config/alacritty/colors.toml && touch ~/.config/alacritty/alacritty.toml"
supported-systems = ["base16", "base24"]

# tmux colors (panes, status bar)
#[[items]]
#name = "tinted-tmux"
#path = "https://github.com/tinted-theming/tinted-tmux"
#themes-dir = "colors"
#hook = "tmux run 2> /dev/null && tmux source-file %f"

# fzf colors
[[items]]
name = "tinted-fzf"
path = "https://github.com/tinted-theming/tinted-fzf"
themes-dir = "sh"
hook = ". %f"

# Delta (git diff pager) colors
[[items]]
path = "https://github.com/tinted-theming/tinted-delta"
name = "tinted-delta"
themes-dir = "configs"
supported-systems = ["base16", "base24"]
