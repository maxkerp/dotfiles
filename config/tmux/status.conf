set -g base-index 1
set-window-option -g pane-base-index 1

# Renumber windows sequentially after closing any of them
set -g renumber-windows on

# Status bar colors from tinted-tmux (base16)
# base00 = bg darkest, base01 = status bg, base04 = status fg dim
# base05 = fg, base0D = blue accent, base0E = mauve/purple accent

# Status bar position and size
set-option -g status-left-length 40
set-option -g status-right-length 80

set -g status-style "fg=#{@base04},bg=#{@base01}"

set -g window-status-format \
  " #[fg=#{@base04},bg=#{@base01}]#W "
set -g window-status-current-format \
  " #[fg=#{@base00},bg=#{@base0E}] #W "
set -g window-status-current-style "fg=#{@base0E},bg=#{@base01}"
set -g window-status-last-style "fg=#{@base0C},bg=#{@base01}"

set -g status-left "#[fg=#{@base00},bg=#{@base0D}] #S "
set -g status-right "#[fg=#{@base05},bg=#{@base01}] #(battery-status)  %d-%m %H:%M "
