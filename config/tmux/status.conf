set -g base-index 1
set-window-option -g pane-base-index 1

# Renumber windows sequentially after closing any of them
set -g renumber-windows on

# Load tinted-tmux base colors (pane borders, messages, clock, etc.)
source-file "~/.local/share/tinted-theming/tinty/artifacts/tinted-tmux-colors-file.conf"

# Load scheme-aware status bar custom format (generated by tinty.bootstrap)
source-file "~/.local/share/tinted-theming/tinty/artifacts/tmux-status-custom.conf"

# Fallback hex values for catppuccin-mocha used when the generated
# tmux-status-custom.conf doesn't exist (e.g. before first tinty apply).
set-option -g status-left-length 40
set-option -g status-right-length 80

set -g status-style "fg=#cdd6f4,bg=#181825"

set -g window-status-format \
  " #[fg=#1e1e2e,bg=#b4befe] #W "
set -g window-status-current-format \
  " #[fg=#1e1e2e,bg=#f9e2af] #W "
set -g window-status-current-style "fg=#f9e2af,bg=#181825"
set -g window-status-last-style "fg=#94e2d5,bg=#181825"

set -g status-left "#[fg=#1e1e2e,bg=#a6e3a1] #S "
set -g status-right "#[fg=#cdd6f4,bg=#181825] #(battery-status)  %d-%m %H:%M "
