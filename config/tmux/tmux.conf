# set -g default-terminal "alacritty"
# set -g terminal-overrides ",alacritty:Tc"
# Improve colors: https://gist.github.com/andersevenrud/015e61af2fd264371032763d4ed965b6
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tinted-theming/tinted-tmux'

run-shell "tmux set-option -g @tinted-color $(tinty current)"

# bootstrap tpm
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# General

bind-key C-r source-file "~/.config/tmux/tmux.conf" \; display-message "~/.tmux.conf reloaded"

set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh

set -g prefix C-s
set -g prefix2 C-s

set -s escape-time 1
set -g history-limit 100000


# Ensure ~/.local/bin and mise shims are in PATH for all tmux subprocesses
run 'tmux set-environment -g PATH "$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"'

# Source Parts
source '/home/max/.config/tmux/navigation.conf'
source '/home/max/.config/tmux/keybinds.conf'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
